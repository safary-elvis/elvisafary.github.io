<style>
:root{
  --bg:#12151f;--fg:#f5f6f8;--card:#1c2130;--secondary:#202634;--muted-fg:#a5adba;
  --primary:#4fd8b6;--primary-fg:#12151f;--border:#39404f;--radius:.6rem;
  --shadow-card:0 24px 60px -30px rgba(4,7,14,.9);
}
*{box-sizing:border-box;border-color:var(--border);margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{text-wrap:pretty}
.display{font-family:"Newsreader",Georgia,serif;font-weight:600;line-height:1.05}
.wrap{max-width:72rem;margin:0 auto;padding:0 1.25rem}
@media(min-width:640px){.wrap{padding:0 2rem}}
.muted{color:var(--muted-fg)}
.primary{color:var(--primary)}
.label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:calc(var(--radius) - 2px);padding:.65rem 1.1rem;font-size:.875rem;font-weight:600;border:1px solid transparent;transition:transform .2s ease,background .2s ease,border-color .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn-solid{background:var(--primary);color:var(--primary-fg);box-shadow:0 10px 28px -14px rgba(79,216,182,.55)}
.btn-outline{border-color:var(--border);color:var(--fg)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-lg{padding:.85rem 1.35rem;font-size:.95rem}
.icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
header.nav{position:fixed;inset:0 0 auto 0;z-index:50;border-bottom:1px solid var(--border);background:rgba(18,21,31,.85);backdrop-filter:blur(14px)}
.nav-inner{display:flex;height:4rem;align-items:center;justify-content:space-between}
.nav-links{display:none;gap:2rem;font-size:.9rem;color:var(--muted-fg)}
.nav-links a:hover{color:var(--fg)}
@media(min-width:768px){.nav-links{display:flex}}
.hero{position:relative;border-bottom:1px solid var(--border);padding-top:4rem}
.grid-bg{position:absolute;inset:0;opacity:.4;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent 88%);mask-image:linear-gradient(to bottom,#000,transparent 88%)}
.hero-grid{position:relative;display:grid;gap:3.5rem;align-items:center;padding:5rem 0}
@media(min-width:1024px){.hero-grid{grid-template-columns:1.15fr .85fr;padding:7rem 0}}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--primary);margin-bottom:1.75rem}
.eyebrow span{height:1px;width:2rem;background:var(--primary)}
h1.display{font-size:clamp(2.6rem,7vw,4.4rem)}
.lead{margin-top:1.75rem;max-width:40rem;font-size:1.1rem;line-height:1.7;color:var(--muted-fg)}
.lead strong{color:var(--fg);font-weight:500}
.cta{margin-top:2.25rem;display:flex;flex-wrap:wrap;gap:.75rem}
.portrait-wrap{position:relative;width:100%;max-width:24rem;margin:0 auto}
.portrait{aspect-ratio:4/5;overflow:hidden;border-radius:var(--radius);border:1px solid var(--border);background:var(--secondary);box-shadow:0 0 0 1px var(--border),0 30px 80px -40px rgba(79,216,182,.5)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:top}
.metrics{position:absolute;bottom:-1.5rem;left:-1rem;display:flex;overflow:hidden;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow-card)}
.metric{padding:1rem 1.35rem;text-align:center}
.metric b{display:block;font-family:"Newsreader",serif;font-size:1.85rem;font-weight:600;color:var(--primary)}
.metric small{display:block;margin-top:.2rem;font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-fg)}
section.band{border-bottom:1px solid var(--border);background:rgba(32,38,52,.35)}
.pad{padding:5rem 0}
.head-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem}
h2.display{font-size:clamp(1.9rem,4.4vw,3rem)}
h3.display{font-size:clamp(1.5rem,3vw,2.1rem)}
.tool-grid{margin-top:2.5rem;display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
@media(min-width:640px){.tool-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.tool-grid{grid-template-columns:repeat(5,1fr)}}
.tool{display:flex;flex-direction:column;align-items:center;gap:1rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:2rem 1rem;text-align:center;transition:transform .3s ease,border-color .3s ease}
.tool:hover{transform:translateY(-4px);border-color:rgba(79,216,182,.6)}
.tool i{display:flex;width:3rem;height:3rem;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--border);background:var(--secondary);color:var(--primary)}
.tool i svg{width:1.25rem;height:1.25rem}
.tool p{font-size:.875rem;font-weight:500;line-height:1.35}
.about{display:grid;gap:2.5rem;padding:6rem 0}
@media(min-width:1024px){.about{grid-template-columns:.6fr 1.4fr}}
.edu{margin-top:2rem;display:grid;gap:1.5rem}
@media(min-width:640px){.edu{grid-template-columns:repeat(3,1fr)}}
.edu div{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:1.25rem}
.edu b{font-family:"Newsreader",serif;font-size:1.5rem;font-weight:600;color:var(--primary)}
.edu p{margin-top:.5rem;font-size:.875rem;color:var(--muted-fg)}
.proj-grid{display:grid;gap:1.5rem}
@media(min-width:1024px){.proj-grid{grid-template-columns:repeat(3,1fr)}}
.card{overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-card);border-color:var(--primary)}
.card .shot{aspect-ratio:16/10;overflow:hidden;border-bottom:1px solid var(--border);background:var(--secondary)}
.card .shot img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s ease}
.card:hover .shot img{transform:scale(1.05)}
.card .body{padding:1.5rem}
.card .tool-tag{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--primary)}
.card h3{margin-top:.4rem;font-family:"Newsreader",serif;font-size:1.45rem;font-weight:600}
.card p{margin-top:.75rem;font-size:.875rem;line-height:1.65;color:var(--muted-fg)}
.card .more{margin-top:1.25rem;display:inline-flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:600}
.card .more:hover{color:var(--primary)}
.two-col{margin-top:6rem;display:grid;gap:3.5rem}
@media(min-width:1024px){.two-col{grid-template-columns:1.1fr .9fr}}
.tl{position:relative;border-left:1px solid var(--border);padding:0 0 2.5rem 1.75rem}
.tl:last-child{padding-bottom:0}
.tl span.dot{position:absolute;left:-.4rem;top:.4rem;width:.75rem;height:.75rem;border-radius:999px;border:2px solid var(--bg);background:var(--primary)}
.tl .per{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--primary)}
.tl h4{margin-top:.25rem;font-family:"Newsreader",serif;font-size:1.25rem;font-weight:600}
.tl .org{font-size:.875rem;color:rgba(245,246,248,.7)}
.tl p{margin-top:.5rem;font-size:.875rem;line-height:1.65;color:var(--muted-fg)}
.skill-group{margin-top:1.75rem}
.skill-group>p{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-fg)}
.chips{margin-top:.75rem;display:flex;flex-wrap:wrap;gap:.5rem}
.chips span{border:1px solid var(--border);border-radius:999px;background:var(--card);padding:.35rem .8rem;font-size:.75rem;font-weight:500;transition:color .2s,border-color .2s}
.chips span:hover{border-color:var(--primary);color:var(--primary)}
.cv-card{margin-top:2.5rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:1.5rem}
.cv-card p.t{font-family:"Newsreader",serif;font-size:1.25rem;font-weight:600}
.cv-card p.s{margin-top:.5rem;font-size:.875rem;color:var(--muted-fg)}
.platforms{margin-top:3rem;display:grid;gap:1px;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:var(--border)}
@media(min-width:640px){.platforms{grid-template-columns:repeat(3,1fr)}}
.platforms a{display:flex;align-items:center;gap:1rem;background:var(--card);padding:1.75rem;transition:background .2s}
.platforms a:hover{background:var(--secondary)}
.platforms svg.big{width:1.5rem;height:1.5rem;color:var(--primary);flex:none}
.platforms .t{font-weight:600}
.platforms .s{font-size:.75rem;color:var(--muted-fg)}
footer{border-top:1px solid var(--border)}
footer p{padding:1.75rem 0;font-size:.875rem;color:var(--muted-fg)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s ease-out both}
.rise-2{animation:rise .7s .14s ease-out both}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rise,.rise-2{animation:none}.reveal{opacity:1;transform:none;transition:none}.card,.tool{transition:none}}
</style>
</head>
