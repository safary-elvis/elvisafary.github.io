<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elvis Ariga Safary — Epidemiologist &amp; Data Scientist</title>
<meta name="description" content="Portfolio of Dr. Elvis Ariga Safary, PhD epidemiologist, global health specialist and data scientist building health dashboards, analytics and evidence for impact." />
<meta name="author" content="Elvis Ariga Safary" />
<meta property="og:title" content="Elvis Ariga Safary — Epidemiologist &amp; Data Scientist" />
<meta property="og:description" content="Health data dashboards, epidemiological research and analytics projects in R, Python and Power BI." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
:root{
  --bg:#f4f4f4; 
  --fg:#111111; 
  --card:#ffffff; 
  --muted-fg:#666666;
  --primary:#c53b4b; /* The red accent color */
  --border:#e0e0e0; 
  --radius:0px; /* The site is very square */
  --hero-bg: #2c303a; /* Fallback dark color */
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:"Open Sans", sans-serif;line-height:1.6;overflow-x:hidden;}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4 { font-family: "Montserrat", sans-serif; margin: 0; }
.muted{color:var(--muted-fg)}
.primary{color:var(--primary)}
.wrap{max-width:70rem;margin:0 auto;padding:0 1.5rem}
@media(min-width:640px){.wrap{padding:0 3rem}}
.icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* HERO SECTION */
.hero {
    position: relative;
    background-color: var(--hero-bg);
    /* Using a dark blurred image as background */
    background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?q=80&w=2070&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    color: #ffffff;
    padding-top: 8rem;
    padding-bottom: 8rem;
}
/* Left Navigation */
.hero-nav {
    position: absolute;
    top: 2rem;
    left: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    font-family: "Montserrat", sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}
.hero-nav a:hover { color: var(--primary); }

/* Hero Text */
.hero-content {
    text-align: center;
    max-width: 60rem;
    margin: 0 auto;
    position: relative;
    z-index: 10;
}
.hero-title {
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 0.02em;
}
.hero-subtitle {
    font-family: "Montserrat", sans-serif;
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 1.5rem;
    color: #d1d1d1;
}
/* Download Resume Button */
.resume-btn-wrap {
    position: absolute;
    top: 2rem;
    right: 2rem;
    display: none;
}
@media(min-width: 1024px) {
    .resume-btn-wrap { display: block; }
    .resume-btn {
        display: inline-block;
        padding: 1rem 2rem;
        border: 1px solid #ffffff;
        color: #ffffff;
        font-family: "Montserrat", sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: background 0.3s, color 0.3s;
    }
    .resume-btn:hover {
        background: #ffffff;
        color: var(--fg);
    }
}
.mobile-resume-btn {
    display: inline-block;
    margin-top: 2rem;
    padding: 1rem 2rem;
    border: 1px solid #ffffff;
    color: #ffffff;
    font-family: "Montserrat", sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}
@media(min-width: 1024px) {
    .mobile-resume-btn { display: none; }
}

/* PORTRAIT IMAGE */
.portrait-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    margin-top: -8rem; /* Pull it up into the hero section */
    z-index: 20;
}
.portrait-img {
    width: 16rem;
    height: 16rem;
    border-radius: 50%;
    object-fit: cover;
    object-position: top;
    border: 8px solid var(--bg);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    background-color: #ccc;
}

/* ABOUT SECTION */
.about-section {
    padding-top: 5rem;
    padding-bottom: 6rem;
}
.about-grid {
    display: grid;
    gap: 3rem;
}
@media(min-width: 900px) {
    .about-grid {
        grid-template-columns: 1fr 2fr; /* Title column vs Text columns */
        gap: 4rem;
    }
}
.about-title-col {
    position: relative;
}
.about-title {
    font-size: 2.5rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.title-accent {
    display: block;
    width: 3rem;
    height: 4px;
    background-color: var(--primary);
    margin-top: 1rem;
}
.social-icon-top {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    background: var(--fg);
    color: var(--bg);
    margin-top: 2rem;
    transition: background 0.3s;
}
.social-icon-top:hover { background: var(--primary); color: #fff; }


.about-text-cols {
    display: grid;
    gap: 2rem;
    font-size: 1.05rem;
    line-height: 1.8;
    color: #444;
}
@media(min-width: 768px) {
    .about-text-cols {
        grid-template-columns: 1fr 1fr;
    }
}
.about-text-cols p { margin-bottom: 1.5rem; }
.about-text-cols p:last-child { margin-bottom: 0; }

/* ARROWS NAVIGATION (Visual only for layout) */
.side-arrows {
    display: none;
}
@media(min-width: 1200px) {
    .side-arrows {
        display: flex;
        justify-content: space-between;
        position: absolute;
        top: 50%;
        left: -2rem;
        right: -2rem;
        transform: translateY(-50%);
        pointer-events: none;
        color: #b0b0b0;
    }
    .side-arrows svg { width: 3rem; height: auto; }
}


/* --- PORTFOLIO & RESUME SECTIONS --- */
.section-divider {
    border-top: 1px solid #dcdcdc;
    padding: 6rem 0;
}
.section-header {
    text-align: center;
    margin-bottom: 4rem;
}
.section-header .label {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.15em;
}
.section-header h2 {
    font-size: 2.2rem;
    font-weight: 700;
    margin-top: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

/* Tool Grid */
.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem}
@media(min-width:640px){.tool-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.tool-grid{grid-template-columns:repeat(5,1fr)}}
.tool{display:flex;flex-direction:column;align-items:center;gap:1rem;background:var(--card);padding:2rem 1rem;text-align:center;transition:transform .3s ease, box-shadow .3s ease; border: 1px solid transparent;}
.tool:hover{transform:translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.05); border-color: var(--border);}
.tool i{display:flex;width:3.5rem;height:3.5rem;align-items:center;justify-content:center;border-radius:999px;background:#f0f0f0;color:var(--primary)}
.tool i svg{width:1.5rem;height:1.5rem}
.tool p{font-family: "Montserrat", sans-serif; font-size:.75rem; font-weight: 600; line-height:1.4; text-transform: uppercase; letter-spacing: 0.05em;}

/* Projects */
.proj-grid{display:grid;gap:2.5rem}
@media(min-width:768px){.proj-grid{grid-template-columns:repeat(2,1fr)}}
.card{overflow:hidden;background:var(--card);transition:transform .3s ease,box-shadow .3s ease; display: flex; flex-direction: column; border: 1px solid var(--border);}
.card:hover{transform:translateY(-5px);box-shadow:0 20px 40px -15px rgba(0,0,0,.15)}
.card .shot{aspect-ratio:16/10;overflow:hidden;background:#eaeaea}
.card .shot img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s ease}
.card:hover .shot img{transform:scale(1.04)}
.card .body{padding:2rem; flex-grow: 1; display: flex; flex-direction: column;}
.card .tool-tag{font-family: "Montserrat", sans-serif; font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-fg)}
.card h3{margin-top:.5rem;font-size:1.4rem;font-weight:600; line-height: 1.3;}
.card p{margin-top:.75rem;font-size:.95rem;line-height:1.7;color:var(--muted-fg); flex-grow: 1;}
.card .more{margin-top:1.5rem;display:inline-flex;align-items:center;gap:.5rem;font-family: "Montserrat", sans-serif; font-size:.75rem;font-weight:600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg); transition: color .2s;}
.card:hover .more{color:var(--primary)}


/* Experience & Skills */
.two-col{display:grid;gap:4rem}
@media(min-width:1024px){.two-col{grid-template-columns:1.1fr .9fr}}
.tl { border-left: 1px solid var(--border); padding: 0 0 2.5rem 2rem; position: relative; }
.tl:last-child{padding-bottom:0}
.tl span.dot{position:absolute;left:-.35rem;top:.4rem;width:.6rem;height:.6rem;border-radius:999px; background:var(--primary)}
.tl .per{font-family: "Montserrat", sans-serif; font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--primary)}
.tl h4{margin-top:.3rem;font-size:1.2rem;font-weight:600}
.tl .org{font-size:.9rem;color:var(--muted-fg); margin-top: .25rem; font-weight: 600;}
.tl p{margin-top:.5rem;font-size:.95rem;line-height:1.7;color:var(--muted-fg)}

.skill-group{margin-top:2.5rem}
.skill-group>p{font-family: "Montserrat", sans-serif; font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-fg); margin-bottom: 0.75rem;}
.chips{display:flex;flex-wrap:wrap;gap:.6rem}
.chips span{background:#eaeaea;padding:.4rem 1rem;font-size:.8rem;font-weight:500;transition:background .2s, color .2s; border-radius: 4px;}
.chips span:hover{background:var(--fg); color:var(--bg)}
.cv-card{margin-top:3rem;background:var(--card);padding:2.5rem; border: 1px solid var(--border);}
.cv-card p.t{font-size:1.5rem;font-weight:600; margin-bottom: 0.5rem;}
.cv-card p.s{font-size:.95rem;color:var(--muted-fg); margin-bottom: 1.5rem;}

/* CONTACT & FOOTER */
.contact-section { background: var(--hero-bg); color: #fff; padding: 6rem 0; text-align: center; }
.contact-section h2 { font-size: 2.5rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
.contact-section p { max-width: 32rem; margin: 0 auto 2.5rem; color: #b0b0b0; font-size: 1.1rem; }
.contact-email { display: inline-block; font-family: "Montserrat", sans-serif; font-size: 1.2rem; font-weight: 600; color: var(--primary); letter-spacing: 0.05em; margin-bottom: 3rem; border-bottom: 1px solid transparent; padding-bottom: 2px;}
.contact-email:hover { border-bottom-color: var(--primary); }
.platforms{display:grid;gap:1px;background:#444; max-width: 45rem; margin: 0 auto; border: 1px solid #444;}
@media(min-width:640px){.platforms{grid-template-columns:repeat(3,1fr)}}
.platforms a{display:flex;align-items:center;gap:1rem;background:var(--hero-bg);padding:1.5rem;transition:background .2s}
.platforms a:hover{background:#3a3f4a}
.platforms svg.big{width:1.5rem;height:1.5rem;color:var(--primary);flex:none}
.platforms .t{font-family: "Montserrat", sans-serif; font-weight:600; font-size: .8rem; text-transform: uppercase; letter-spacing: 0.05em;}
.platforms .s{font-size:.75rem;color:#999; margin-top: 2px;}
.platforms .arrow-icon { color: #666; }

footer{ padding: 2rem 0; text-align: center; font-size:.75rem;color:var(--muted-fg); text-transform: uppercase; letter-spacing: 0.1em; font-family: "Montserrat", sans-serif;}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.rise{animation:fadeIn .8s ease-out both}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .8s ease,transform .8s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rise{animation:none}.reveal{opacity:1;transform:none;transition:none}.card,.tool{transition:none}}
</style>
