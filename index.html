<meta name="description" content="Portfolio of Dr. Elvis Ariga Safary, PhD epidemiologist, global health specialist and data scientist building health dashboards, analytics and evidence for impact." />

<style>
:root {
  --bg: #fbfaf7;
  --fg: #161513;
  --card: #fff;
  --muted-fg: #77716a;
  --line: #e4e0d8;
  --font-body: "DM Sans", system-ui, sans-serif;
  --font-display: "Newsreader", Georgia, serif;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  scroll-behavior: smooth;
}
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
img {
  display: block;
  max-width: 100%;
}
a {
  color: inherit;
  text-decoration: none;
}
h1, h2, h3, h4, p {
  text-wrap: pretty;
}
.display {
  font-family: var(--font-display);
  font-weight: 500;
  line-height: 1.1;
}
.container {
  max-width: 72rem;
  margin: 0 auto;
  padding: 0 1.5rem;
}
@media (min-width: 640px) {
  .container {
    padding: 0 2.5rem;
  }
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  border-radius: 2px;
  padding: .7rem 1.4rem;
  font-size: .8rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  border: 1px solid var(--fg);
  background: transparent;
  transition: all .25s ease;
  cursor: pointer;
}
.btn-solid {
  background: var(--fg);
  color: var(--bg);
}
.btn-solid:hover {
  background: #333;
  border-color: #333;
}
.btn-outline:hover {
  background: var(--fg);
  color: var(--bg);
}
.icon {
  width: 1em;
  height: 1em;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* HEADER */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 50;
  background: rgba(251, 250, 247, 0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 4rem;
}
.nav-left, .nav-right {
  display: flex;
  align-items: center;
  gap: 2rem;
}
.nav-links {
  display: none;
  list-style: none;
  gap: 2rem;
}
.nav-links a {
  font-size: .85rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .05em;
  position: relative;
  padding-bottom: 4px;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 1px;
  background-color: var(--fg);
  transform: scaleX(0);
  transform-origin: bottom right;
  transition: transform .3s ease-out;
}
.nav-links a:hover::after {
  transform: scaleX(1);
  transform-origin: bottom left;
}
@media (min-width: 768px) {
  .nav-links {
    display: flex;
  }
}

/* HERO */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8rem 1.5rem 4rem;
}
.hero h1 {
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  letter-spacing: -.03em;
}
.hero .subtitle {
  font-size: clamp(.9rem, 2vw, 1.1rem);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .1em;
  margin-top: 1rem;
  color: var(--muted-fg);
}
.portrait {
  width: 240px;
  height: 240px;
  border-radius: 50%;
  overflow: hidden;
  margin-top: 3rem;
  border: 4px solid var(--card);
  box-shadow: 0 0 0 1px var(--line), 0 20px 50px -20px rgba(0,0,0,.2);
}
.portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(100%);
}

/* ABOUT & EDUCATION CAROUSEL */
.carousel-section {
  padding: 4rem 1.5rem;
}
.carousel-container {
  max-width: 48rem;
  margin: 0 auto;
  position: relative;
  min-height: 300px;
}
.slide {
  display: none;
  animation: fadeIn 1s ease-in-out;
}
.slide.active {
  display: block;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
.slide h2 {
  font-size: clamp(1.8rem, 4vw, 2.5rem);
  text-align: center;
  margin-bottom: 2rem;
}
.slide p {
  font-size: 1.05rem;
  color: var(--muted-fg);
  line-height: 1.8;
}
.slide p strong {
  color: var(--fg);
  font-weight: 500;
}
.edu-list {
  list-style: none;
  display: grid;
  gap: 1.5rem;
}
.edu-item {
  border: 1px solid var(--line);
  background: var(--card);
  padding: 1.5rem;
  border-radius: 4px;
}
.edu-item b {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 500;
  display: block;
}
.edu-item p {
  margin-top: .25rem;
  font-size: .9rem;
}
.carousel-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 100%;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}
.carousel-btn {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  cursor: pointer;
  pointer-events: all;
  transition: background .2s, color .2s;
}
.carousel-btn:hover {
  background: var(--fg);
  color: var(--bg);
}
@media (max-width: 768px) {
  .carousel-nav { width: auto; right: 0; top: 0; transform: none; gap: .5rem; }
}


/* PROJECTS */
.projects {
  padding: 6rem 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.projects-header {
  text-align: center;
  margin-bottom: 4rem;
}
.projects-header h2 {
  font-size: clamp(2rem, 4.5vw, 3rem);
}
.projects-header p {
  margin-top: 1rem;
  color: var(--muted-fg);
  max-width: 40rem;
  margin-left: auto;
  margin-right: auto;
}
.proj-grid {
  display: grid;
  gap: 2.5rem;
}
@media (min-width: 1024px) {
  .proj-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  transition: transform .3s ease, box-shadow .3s ease;
}
.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 25px 50px -25px rgba(0,0,0,.2);
}
.card .shot {
  aspect-ratio: 16/10;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
}
.card .shot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  transition: transform .4s ease;
}
.card:hover .shot img {
  transform: scale(1.05);
}
.card .body {
  padding: 1.5rem;
}
.card .tool-tag {
  font-size: .75rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--muted-fg);
}
.card h3 {
  margin-top: .5rem;
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 500;
}
.card p {
  margin-top: .75rem;
  font-size: .9rem;
  color: var(--muted-fg);
}
.card .more {
  margin-top: 1.25rem;
  font-size: .85rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: .5rem;
}
.card .more:hover {
  text-decoration: underline;
}

/* CONTACT */
.contact {
  padding: 6rem 0;
}
.contact-container {
  max-width: 40rem;
  margin: 0 auto;
}
.contact h2 {
  text-align: center;
  font-size: clamp(2rem, 4.5vw, 3rem);
  margin-bottom: 3rem;
}
form {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.form-group label {
  display: block;
  font-size: .8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: .5rem;
}
.form-group input,
.form-group textarea {
  width: 100%;
  padding: .8rem 1rem;
  border: 1px solid var(--line);
  background: var(--bg);
  font-family: var(--font-body);
  font-size: 1rem;
  color: var(--fg);
  border-radius: 2px;
  transition: border-color .2s;
}
.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--fg);
}
.form-group textarea {
  min-height: 120px;
  resize: vertical;
}
.form-btn {
  align-self: flex-start;
}

/* FOOTER */
footer {
  border-top: 1px solid var(--line);
  padding: 2rem 0;
  text-align: center;
  font-size: .875rem;
  color: var(--muted-fg);
}
</style>
